[workspace]
members = [
    "hessra-cap-engine",
    "hessra-cap-policy",
    "hessra-cap-schema",
    "hessra-cap",
]

resolver = "3"

[workspace.dependencies]
hessra-token-core = { version = "2.0" }
hessra-cap-token = { version = "2.0" }
hessra-identity-token = { version = "2.0" }
hessra-context-token = { version = "2.0" }
hessra-cap-engine = { path = "hessra-cap-engine", version = "0.5.0" }
hessra-cap-policy = { path = "hessra-cap-policy", version = "0.4.0" }
hessra-cap-schema = { path = "hessra-cap-schema", version = "0.1.0" }
biscuit-auth = { version = "6.0", features = ["pem"] }
base64 = "0.22"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
hex = "0.4"
toml = "0.8"
glob-match = "0.2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Co-developing against the in-tree hessra-tokens workspace? Uncomment this
# block to redirect the published token crates to their local paths (unpublished
# changes picked up, one shared hessra-token-core across all of them). Do NOT
# commit it uncommented: the sibling path does not exist in CI, and cargo fails
# resolution outright on a missing patch source. Re-comment (and republish the
# token crates) before pushing.
# [patch.crates-io]
# hessra-token-core = { path = "../hessra-tokens/hessra-token-core" }
# hessra-cap-token = { path = "../hessra-tokens/hessra-cap-token" }
# hessra-identity-token = { path = "../hessra-tokens/hessra-identity-token" }
# hessra-context-token = { path = "../hessra-tokens/hessra-context-token" }
